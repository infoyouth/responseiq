name: Release Candidate Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-verify:
    name: 🔬 RC Verify (Py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a  # v7

      - name: 📦 Sync development environment
        run: uv sync --group dev --active

      - name: 🔢 Verify package version consistency
        run: |
          uv run python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          version_source = Path("src/responseiq/__version__.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']$', version_source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read src/responseiq/__version__.py")
          runtime = match.group(1)
          if declared != runtime:
              raise SystemExit(f"Version mismatch: pyproject.toml={declared}, __version__.py={runtime}")
          print(f"Version consistent: {declared}")

      - name: 🎨 Format check
        run: uv run ruff format --check src tests

      - name: 🔍 Lint
        run: uv run ruff check src tests

      - name: 🔬 Type check
        run: uv run mypy src

      - name: 🔒 Security scan
        run: uv run ruff check --select S src

      - name: 🛡️ Dependency audit
        run: uv run pip-audit --format cyclonedx-json -o /tmp/responseiq-pip-audit.json

      - name: 🧪 Run full test suite
        run: uv run pytest -n auto --dist=loadscope --maxfail=1 --disable-warnings -q

      - name: 🏗️ Build distributables
        run: |
          rm -rf dist
          uv build

      - name: 📦 Install wheel in fresh venv
        run: |
          uv venv /tmp/responseiq-rc
          WHEEL_PATH=$(ls -t dist/*.whl | head -n 1)
          uv pip install --python /tmp/responseiq-rc/bin/python "$WHEEL_PATH"

      - name: 💨 CLI smoke tests
        run: |
          /tmp/responseiq-rc/bin/responseiq --help
          /tmp/responseiq-rc/bin/python -m responseiq.cli --help

      - name: 🏥 API health smoke test
        run: |
          /tmp/responseiq-rc/bin/python -m uvicorn responseiq.app:app --host 127.0.0.1 --port 8001 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 5
          curl -fsS http://127.0.0.1:8001/health
