name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    # Weekly scan on Saturday at 01:30 UTC
    - cron: "30 1 * * 6"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: 🛡️ Scorecard analysis
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write # required for OIDC token → publish_results

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to https://api.scorecard.dev — powers the README badge
          publish_results: true

      - name: 📤 Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 🛡️ Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          sarif_file: results.sarif
