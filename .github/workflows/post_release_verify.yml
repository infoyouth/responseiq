name: Post-Release Verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source:
        description: "Verification source: local (build from checkout) or pypi (install released package)"
        required: false
        default: "local"
      version:
        description: "Release version to verify (e.g. 1.3.8 or v1.3.8)"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: ✅ Verify from PyPI (Py${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            api-port: 8011
          - python-version: "3.12"
            api-port: 8012

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: 🔍 Resolve verification mode and version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            SOURCE="pypi"
            RAW_VERSION="${{ github.event.release.tag_name }}"
          else
            SOURCE="${{ github.event.inputs.source || 'local' }}"
            RAW_VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Verification source: $SOURCE"
          echo "Verifying responseiq==$VERSION"

      - name: ✅ Verify released artifact
        run: |
          uv run python scripts/post_release_verify.py \
            --source "${{ steps.version.outputs.source }}" \
            --version "${{ steps.version.outputs.version }}" \
            --api-port "${{ matrix.api-port }}"

  notify-failure:
    name: 🚨 Open issue on failure
    needs: verify
    if: failure()
    runs-on: ubuntu-26.04

    steps:
      - name: 🚨 Open failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const releaseTag = context.eventName === 'release'
              ? context.payload.release?.tag_name
              : context.payload.inputs?.version;

            const title = `Post-release verification failed (${releaseTag ?? 'unknown-version'})`;
            const body = [
              'Automated post-release verification failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Trigger: ${context.eventName}`,
              `- Version input/tag: ${releaseTag ?? 'N/A'}`,
              '',
              'Please inspect the failing verification job and remediate before further rollout.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
