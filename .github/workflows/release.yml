name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write        # required for OIDC Trusted Publishing to PyPI
  attestations: write   # required for actions/attest-build-provenance (SLSA)

jobs:
  pre-release-verify:
    name: 🔬 Pre-release verification
    uses: ./.github/workflows/release_candidate.yml

  release:
    name: 🏷️ Semantic Release
    needs: pre-release-verify
    runs-on: ubuntu-26.04
    concurrency: release
    outputs:
      new_release_published: ${{ steps.semantic.outputs.released }}
      new_release_version: ${{ steps.semantic.outputs.version }}
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: 🏷️ Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0  # v10.5.3
        with:
          github_token: ${{ secrets.RELEASE_PAT }}
          git_committer_name: "Youth Innovations"
          git_committer_email: "info.youthinno@gmail.com"
          changelog: false  # git-cliff owns CHANGELOG.md

      - name: 🔍 Validate exact release wheel
        if: steps.semantic.outputs.released == 'true'
        env:
          RELEASE_VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          uv venv /tmp/responseiq-release-smoke
          wheel=$(ls -t dist/*.whl | head -n 1)
          uv pip install --python /tmp/responseiq-release-smoke/bin/python "$wheel"
          /tmp/responseiq-release-smoke/bin/python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["RELEASE_VERSION"]
          actual = version("responseiq")
          if actual != expected:
              raise SystemExit(f"Wheel version mismatch: expected {expected}, got {actual}")
          print(f"Validated wheel version: {actual}")
          PY
          /tmp/responseiq-release-smoke/bin/responseiq --help >/dev/null

      # ---------------------------------------------------------------------------
      # git-cliff: generate a rich, human-readable CHANGELOG.md after PSR tags
      # ---------------------------------------------------------------------------
      - name: 📝 Generate CHANGELOG (git-cliff)
        if: steps.semantic.outputs.released == 'true'
        continue-on-error: true  # git-cliff exits 1 on unparseable commits; file is still written
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72  # v4
        with:
          config: cliff.toml
          args: --verbose --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 💾 Commit CHANGELOG
        if: steps.semantic.outputs.released == 'true'
        run: |
          git config user.name "Youth Innovations"
          git config user.email "info.youthinno@gmail.com"
          # PSR v10 commits+pushes in-process inside this same runner, so local HEAD == remote HEAD.
          # git pull --rebase is NOT used here — git-cliff writes CHANGELOG.md as an unstaged
          # file, which causes rebase to immediately abort with "unstaged changes".
          # Simply stage, commit, and push directly.
          git add CHANGELOG.md
          git diff --cached --quiet && echo "CHANGELOG unchanged" || \
            git commit -m "docs: update CHANGELOG for v${{ steps.semantic.outputs.version }} [skip ci]"
          git push

      - name: 📦 Upload validated distributions
        if: steps.semantic.outputs.released == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: 🧪 Publish and verify TestPyPI
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/responseiq/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: ⬇️ Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: 🚀 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: 🔍 Install and smoke-test TestPyPI release
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          uv venv /tmp/responseiq-testpypi
          for attempt in {1..8}; do
            wheel_url=$(curl -fsS https://test.pypi.org/pypi/responseiq/json \
              | jq -r --arg version "$RELEASE_VERSION" \
                '.info.version as $published | select($published == $version) | .urls[] | select(.filename | endswith(".whl")) | .url' \
              | head -n 1 || true)
            if [ -n "$wheel_url" ] && uv pip install --python /tmp/responseiq-testpypi/bin/python \
              --no-cache \
              --index-url https://pypi.org/simple/ \
              "$wheel_url"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "TestPyPI package was not installable after retries"
              exit 1
            fi
            sleep 20
          done
          /tmp/responseiq-testpypi/bin/responseiq --help
          /tmp/responseiq-testpypi/bin/python -m responseiq.cli --help

  publish-pypi:
    name: 🚀 Publish to PyPI
    needs: publish-testpypi
    if: needs.publish-testpypi.result == 'success'
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://pypi.org/project/responseiq/
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: ⬇️ Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1
        with:
          attestations: true

      - name: 🔐 Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: dist/*

  docker-publish:
    name: 🐳 Build & Push Docker
    needs:
      - release
      - publish-pypi
    if: needs.release.outputs.new_release_published == 'true' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-26.04
    environment: production   # explicit gate — covered transitively by release, but explicit for auditability
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: 📦 Build & push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
