name: Scheduled quality checks

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-tests:
    name: Hypothesis properties
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --active
      - name: Run property tests
        run: uv run pytest -m property --hypothesis-show-statistics -q

  mutation-tests:
    name: Targeted mutation tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --active
      - name: Run targeted mutations
        run: |
          uv run --with mutmut==3.8.0 mutmut run --max-children 2
          uv run --with mutmut==3.8.0 mutmut results --all true > mutmut-results.txt
          killed=$(grep -c ': killed$' mutmut-results.txt)
          survived=$(grep -c ': survived$' mutmut-results.txt)
          timeout=$(grep -c ': timeout$' mutmut-results.txt)
          scored=$((killed + survived))
          score=$(awk -v killed="$killed" -v scored="$scored" 'BEGIN { printf "%.2f", (killed * 100) / scored }')
          echo "Mutation score: ${score}% (${killed} killed, ${survived} survived, ${timeout} timed out)"
          if awk -v score="$score" 'BEGIN { exit !(score < 70) }'; then
            echo "Mutation score is below the 70% minimum."
            exit 1
          fi
